site_name: Delta for Mere Mortals
site_description: A pager that makes git diffs readable. Syntax highlighting, emphasis on the words that changed inside a line, line numbers and side-by-side views for diff, log and blame, wired into git with a few lines of configuration, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/delta-for-mere-mortals/
